<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brian’s Music Listener</title><style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef2ff;font:16px system-ui}main{max-width:850px;margin:auto;padding:22px}h1{font-size:25px;margin:0}p{color:#a5b3ce;font-size:14px}section{background:#121d31;border:1px solid #263653;border-radius:18px;padding:18px;margin-top:18px}button,input,select{font:inherit}button,.file{background:#223454;color:white;border:1px solid #3a5277;border-radius:10px;padding:11px;cursor:pointer}button:hover{background:#355177}button.on{background:#6652b9}input[type=search]{width:100%;padding:12px;background:#080f1e;color:white;border:1px solid #354b70;border-radius:10px;margin:15px 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap}audio{width:100%;margin:16px 0}.song{display:flex;width:100%;text-align:left;align-items:center;gap:12px;margin:7px 0}.song.active{border-color:#a79aff;background:#382c61}.song span{flex:1;overflow-wrap:anywhere}.song small{display:block;color:#aebbd0;font-size:12px;margin-top:4px}#now{font-size:22px;overflow-wrap:anywhere}#status{min-height:22px;color:#bac7df;font-size:14px}.file input{display:none}a{color:#b4a5ff}#list{max-height:55vh;overflow:auto}button:focus-visible{outline:3px solid #b7a7ff}@media(max-width:500px){main{padding:12px}section{padding:14px}}</style><main><h1>♫ Brian’s Music Listener</h1><p>razaci / music · Click any song to listen</p><section><div id="now">Choose a song</div><audio id="audio" controls preload="metadata"></audio><div class="toolbar"><button id="prev" aria-label="Previous song">⏮ Previous</button><button id="next">Next ⏭</button><button id="shuffle" aria-pressed="false">Shuffle: off</button><button id="repeat" aria-pressed="false">Repeat: off</button></div></section><section><div class="toolbar"><button id="refresh">↻ Refresh GitHub songs</button><label class="file">＋ Local songs<input id="local" type="file" accept="audio/*,.mp3" multiple></label><a href="https://github.com/razaci/music" target="_blank" rel="noopener" style="padding:11px">Open repository ↗</a></div><input id="search" type="search" placeholder="Search songs or folders…" aria-label="Search songs"><div id="status" role="status"></div><div id="list"></div></section><p>GitHub songs stream over the internet. Local songs stay on your device. Add MP3s anywhere in your repository, then refresh.</p></main><script>
'use strict';const $=id=>document.getElementById(id),audio=$('audio');let songs=[],current=-1,shuffle=false,repeat=false,loading=false,localURLs=[];
function status(s){$('status').textContent=s}function render(){const q=$('search').value.toLowerCase();$('list').replaceChildren();songs.forEach((s,i)=>{if(!(s.name+' '+s.folder).toLowerCase().includes(q))return;const b=document.createElement('button');b.className='song'+(i===current?' active':'');b.setAttribute('aria-label','Play '+s.name);const number=document.createElement('b');number.textContent=i===current?'♫':String(i+1).padStart(2,'0');const text=document.createElement('span');text.textContent=s.name;const sub=document.createElement('small');sub.textContent=s.folder||'Repository root';text.append(sub);b.append(number,text);b.onclick=()=>play(i);$('list').append(b)})}
async function play(i){if(!songs[i])return;current=i;audio.src=songs[i].url;$('now').textContent=songs[i].name;render();if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:songs[i].name,artist:'Brian’s Music'});}try{await audio.play();status('Playing '+songs[i].name)}catch(e){status('Press the audio Play button to start. If it fails, check that the MP3 is available.')}}
function step(d){if(!songs.length)return;let n=current<0?0:(current+d+songs.length)%songs.length;if(shuffle&&songs.length>1){do{n=Math.floor(Math.random()*songs.length)}while(n===current)}play(n)}
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error(r.status===403||r.status===429?'GitHub’s request limit was reached. Try again later or use Local songs.':'GitHub request failed ('+r.status+'). Check your connection and repository visibility.');return r.json()}
async function scan(){if(loading)return;loading=true;$('refresh').disabled=true;status('Scanning your GitHub folders…');try{const repo=await get('https://api.github.com/repos/razaci/music');const branch=repo.default_branch;const data=await get('https://api.github.com/repos/razaci/music/git/trees/'+encodeURIComponent(branch)+'?recursive=1');if(data.truncated)throw Error('Repository listing is too large. Use Local songs for now.');const found=data.tree.filter(x=>x.type==='blob'&&/\.(mp3|m4a|ogg|wav|aac|flac)$/i.test(x.path)).map(x=>({name:x.path.split('/').pop().replace(/\.[^.]+$/,'').replace(/_/g,' '),folder:x.path.includes('/')?x.path.slice(0,x.path.lastIndexOf('/')):'',url:'https://raw.githubusercontent.com/razaci/music/'+encodeURIComponent(branch)+'/'+x.path.split('/').map(encodeURIComponent).join('/')})).sort((a,b)=>a.name.localeCompare(b.name));const selected=songs[current]?.url;songs=found.concat(songs.filter(s=>s.local));current=songs.findIndex(s=>s.url===selected);render();status(found.length?found.length+' GitHub songs found. Click a song to play.':'No audio files found on '+branch+' yet. Upload your MP3s to GitHub, then press Refresh.')}catch(e){status(e.message)}finally{loading=false;$('refresh').disabled=false}}
$('refresh').onclick=scan;$('search').oninput=render;$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').textContent='Shuffle: '+(shuffle?'on':'off');$('shuffle').classList.toggle('on',shuffle);$('shuffle').setAttribute('aria-pressed',shuffle)};$('repeat').onclick=()=>{repeat=!repeat;audio.loop=repeat;$('repeat').textContent='Repeat: '+(repeat?'on':'off');$('repeat').classList.toggle('on',repeat);$('repeat').setAttribute('aria-pressed',repeat)};audio.onended=()=>{if(!repeat)step(1)};audio.onerror=()=>status('This audio could not load. Check that it is a real audio file, rather than a Git LFS pointer, and is publicly accessible.');$('local').onchange=e=>{for(const f of e.target.files){const url=URL.createObjectURL(f);localURLs.push(url);songs.push({name:f.name.replace(/\.[^.]+$/,''),folder:'On your device',url,local:true})}render();status(songs.length+' songs ready. Click one to listen.');e.target.value=''};if('mediaSession'in navigator){navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));}scan();
</script></html>
